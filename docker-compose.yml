services:
  app:
    build: .
    ports:
      - "5001:5000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - docchat-cache:/app/document_cache
    depends_on:
      - chroma
    networks:
      - docchat-network
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - docchat-chroma:/chroma/chroma
    networks:
      - docchat-network
    restart: unless-stopped

volumes:
  docchat-chroma:
  docchat-cache:

networks:
  docchat-network:
    driver: bridge
